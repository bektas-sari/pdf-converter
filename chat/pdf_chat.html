<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chat with PDF</title>
  <link rel="stylesheet" href="pdf_chat.css" />
</head>
<body>
  <h2>Chat with your PDF</h2>
  <div id="chat-box">

    </div>
  </div>

  <script src="pdf_chat.js"></script>
</body>
</html>
