<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SuperPDF</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="lib/fontawesome/css/all.min.css" />
</head>
<body>
  <div class="container">
    <img src="assets/logo.png" alt="SuperPDF Logo" class="logo" />
    <h1>SuperPDF</h1>

    <div class="buttons">
      <button id="open-pdf">PDF Aç</button>
      <button id="edit-pdf">PDF Düzenle</button>
      <button id="convert-pdf">Dönüştür</button>
      <button id="fill-form">Form Doldur</button>
      <button id="sign-pdf">E-İmza</button>
      <button id="chat-pdf">PDF ile Sohbet</button>
    </div>

    <h2>Son Kullanılan PDF'ler</h2>
    <ul id="recent-files-list"></ul>

    <footer>SuperPDF v1.0.0</footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
